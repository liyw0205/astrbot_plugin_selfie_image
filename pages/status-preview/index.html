<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="生图记录状态图片的五种设计预览">
  <meta name="theme-color" content="#f1f3f2">
  <title>生图状态 · 设计预览</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip caption" href="#main">跳到预览</a>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">S</span><span class="title">生图状态<span class="brand-divider">/</span><span class="secondary">设计预览</span></span></div>
    <span class="demo caption"><span class="dot"></span>演示数据</span>
  </header>
  <main id="main">
    <div class="page-heading"><h1 class="heading">状态图片</h1><span class="caption secondary">05 个方案</span></div>
    <nav class="designs" aria-label="设计方案">
      <a href="?v=1" data-design="1"><span class="design-number">01</span><span>清透简报</span><span class="swatch" style="--swatch:#087f72"></span></a>
      <a href="?v=2" data-design="2"><span class="design-number">02</span><span>石墨监控</span><span class="swatch" style="--swatch:#a8e779"></span></a>
      <a href="?v=3" data-design="3"><span class="design-number">03</span><span>双栏卡片</span><span class="swatch" style="--swatch:#007eaa"></span></a>
      <a href="?v=4" data-design="4"><span class="design-number">04</span><span>瑞士排版</span><span class="swatch" style="--swatch:#e24b40"></span></a>
      <a href="?v=5" data-design="5"><span class="design-number">05</span><span>紧凑表格</span><span class="swatch" style="--swatch:#b28b17"></span></a>
    </nav>
    <div class="toolbar">
      <label class="scenario-label caption">数据场景<select id="scenario" aria-label="数据场景"><option value="mixed">混合状态</option><option value="healthy">全部正常</option><option value="empty">暂无记录</option><option value="stress">长名称 / 多页</option></select></label>
      <div class="view-modes" role="group" aria-label="预览尺寸"><button type="button" id="fit" aria-pressed="true">适应宽度</button><button type="button" id="actual" aria-pressed="false">原始尺寸</button></div>
      <a class="download icon-button" id="download" href="/report.png?design=1&amp;download=1" download aria-label="下载 PNG" title="下载 PNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span>PNG</span></a>
    </div>
    <section class="stage" aria-label="状态图片预览" aria-busy="true">
      <div class="image-meta caption"><span id="image-label">01 / 清透简报</span><span id="dimensions" class="secondary">生成中</span></div>
      <div class="image-viewport" id="viewport"><img id="report" width="1080" height="1612" alt="清透简报版生图模型运行状态" src="/report.png?design=1&amp;scenario=mixed&amp;page=1"></div>
      <p class="error caption" id="error" role="alert" hidden>图片加载失败，请重试。</p>
      <div class="preview-footer caption"><span class="secondary">PNG · 第 <span id="page-number">1</span> 页</span><div class="pagination"><button class="icon-button" id="previous" aria-label="上一页" title="上一页" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><span id="page-count">1 / 2</span><button class="icon-button" id="next" aria-label="下一页" title="下一页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div></div>
    </section>
  </main>
  <footer class="site-footer caption"><span>Selfie Image</span><span id="current-version">方案 01 / 05</span></footer>
</body>
</html>
