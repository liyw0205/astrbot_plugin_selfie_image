<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selfie Image · Atelier</title><style>:root{--ink:#27221e;--muted:#8c837b;--cream:#f4efe8;--paper:#fffdf9;--line:#e4ddd4;--orange:#e2774e;--olive:#78805f;--purple:#766b96;font-family:Georgia,"Noto Serif SC","Microsoft YaHei",serif}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:76px 1fr}.rail{background:#2d2925;color:#ede6dc;display:flex;flex-direction:column;align-items:center;padding:22px 9px}.sig{font-family:Georgia;font-size:24px;font-style:italic;color:#f0a080;margin-bottom:42px}.rail button{width:46px;height:46px;background:transparent;border:0;color:#9e958c;border-radius:13px;font-size:18px;margin:3px}.rail button:hover,.rail button.active{background:#494039;color:#fff}.rail-foot{margin-top:auto;color:#9e958c;font-size:12px}.main{padding:28px 42px;max-width:1440px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.top-left{display:flex;align-items:center;gap:18px}.top h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.08em}.top-left span{color:var(--muted);font-size:12px}.top-right{display:flex;gap:12px;align-items:center;color:var(--muted);font-family:system-ui;font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f2b391,#a88bb2);border:2px solid #fff}.intro{padding:38px 0 30px;display:flex;justify-content:space-between;align-items:end}.intro h2{font-size:40px;line-height:1.1;font-weight:400;margin:8px 0;letter-spacing:-.06em}.intro p{font-size:13px;color:var(--muted);margin:0}.date{font-family:system-ui;color:var(--muted);font-size:11px}.create{display:grid;grid-template-columns:1fr 1fr;gap:18px}.prompt-box{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:23px;min-height:290px}.label{font-family:system-ui;color:var(--orange);font-size:10px;letter-spacing:.16em;font-weight:800}.prompt-box textarea{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;min-height:145px;font-size:24px;line-height:1.45;color:var(--ink);margin-top:18px}.prompt-box textarea::placeholder{color:#bdb3a9}.controls{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:16px;font-family:system-ui}.select{background:#f7f3ee;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:11px}.generate{margin-left:auto;background:var(--orange);color:#fff;border:0;border-radius:9px;padding:10px 15px;font-family:system-ui;font-size:12px;font-weight:700}.generate:hover{background:#c85e39}.visual{background:#ded6ca;border-radius:20px;min-height:290px;position:relative;overflow:hidden;background-image:radial-gradient(ellipse at 60% 30%,#d3b1a2 0 14%,transparent 15%),linear-gradient(130deg,#6b5268,#c78d70 46%,#e4c69e 47%,#87927a)}.visual:after{content:"preview";position:absolute;right:20px;top:18px;color:#fff8;font:italic 12px Georgia}.visual .caption{position:absolute;bottom:20px;left:22px;color:#fff;font-size:13px}.visual .caption b{display:block;font-size:19px;margin-bottom:5px}.below{display:grid;grid-template-columns:1fr .65fr;gap:18px;margin-top:18px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.head h3{font-size:15px;font-weight:600;margin:0}.head span{font:11px system-ui;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.work{height:112px;border-radius:12px;background:linear-gradient(135deg,#6e526e,#e7bd8e);position:relative;overflow:hidden}.work:nth-child(2){background:linear-gradient(135deg,#506c76,#e4c697)}.work:nth-child(3){background:linear-gradient(135deg,#9a6974,#dcb2c0)}.work span{position:absolute;bottom:8px;left:9px;color:#fff;font:10px system-ui;text-shadow:0 1px 5px #0008}.health{display:grid;gap:14px;font-family:system-ui}.health-row{display:flex;align-items:center;gap:10px;font-size:12px}.health-row i{width:7px;height:7px;border-radius:50%;background:#6eaf83}.health-row i.warn{background:#dfaa58}.health-row span:last-child{margin-left:auto;color:var(--muted);font-size:10px}.quote{margin-top:18px;padding:18px;background:#e9e4d8;border-radius:14px;color:#6f665d;font-size:13px;line-height:1.7;font-style:italic}.quote b{display:block;color:var(--ink);font-style:normal;font-size:11px;margin-top:8px}@media(max-width:850px){.shell{grid-template-columns:1fr}.rail{position:fixed;z-index:4;left:-76px;top:0;bottom:0;transition:.2s}.rail.open{left:0}.main{padding:20px 16px}.intro{padding:28px 0 22px}.intro h2{font-size:32px}.create,.below{grid-template-columns:1fr}.top-left h1:before{content:'☰';margin-right:14px;cursor:pointer}.gallery{grid-template-columns:repeat(3,1fr)}}@media(max-width:460px){.controls{flex-wrap:wrap}.generate{margin-left:0;width:100%}}
</style></head><body><div class="shell"><aside class="rail" id="rail"><div class="sig">s.</div><button class="active" title="工作台">⌂</button><button title="创作">✦</button><button title="渠道">◌</button><button title="任务">☷</button><button title="设置">⚙</button><div class="rail-foot">☼</div></aside><main class="main"><header class="top"><div class="top-left"><h1>SELFIE IMAGE</h1><span>/ 创作工作室</span></div><div class="top-right"><span>工作空间已连接</span><i class="avatar"></i></div></header><section class="intro"><div><div class="label">YOUR CREATIVE ATELIER</div><h2>你好，开始创作吧。</h2><p>每一个画面，都值得被认真对待。</p></div><div class="date">星期三 · 08 月 19 日</div></section><section class="create"><div class="prompt-box"><div class="label">PROMPT</div><textarea placeholder="描述你想要的画面……"></textarea><div class="controls"><select class="select"><option>Flux Pro</option><option>SDXL Studio</option></select><select class="select"><option>正方形 1:1</option><option>竖屏 2:3</option><option>横屏 16:9</option></select><button class="generate" id="gen">生成画面　→</button></div></div><div class="visual"><div class="caption"><b>今日灵感</b>黄昏、微风与一段未完的旅程</div></div></section><section class="below"><div class="paper"><div class="head"><h3>最近的作品</h3><span>全部作品　→</span></div><div class="gallery"><div class="work"><span>雨夜城市</span></div><div class="work"><span>午后窗边</span></div><div class="work"><span>春日花园</span></div></div></div><div class="paper"><div class="head"><h3>工作室状态</h3><span>实时</span></div><div class="health"><div class="health-row"><i></i><b>Flux Pro</b><span>运行良好</span></div><div class="health-row"><i></i><b>SDXL Studio</b><span>运行良好</span></div><div class="health-row"><i class="warn"></i><b>Video Lab</b><span>响应较慢</span></div></div><div class="quote">“创作不是等待灵感，而是给灵感一个可以落脚的地方。”<b>— Selfie Image</b></div></div></section></main></div><script>const rail=document.querySelector('#rail');document.querySelector('.top-left h1').onclick=()=>rail.classList.toggle('open');document.querySelectorAll('.rail button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rail button').forEach(x=>x.classList.remove('active'));b.classList.add('active');rail.classList.remove('open')});document.querySelector('#gen').onclick=function(){this.textContent='正在生成…';this.disabled=true;setTimeout(()=>{this.textContent='生成完成　→';this.disabled=false},1400)};</script></body></html>
